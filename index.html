<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dff3ef">
  <title>Долина — моя ферма</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #203b35;
      --muted: #58766b;
      --leaf: #2f7652;
      --leaf-light: #78b96d;
      --sun: #f3ba4a;
      --soil: #876042;
      --soil-deep: #674a35;
      --paper: #fffaf0;
      --line: #dfdfc7;
      --sky: #c9e8e7;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background: #eef5eb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse at 86% 4%, rgba(251, 217, 134, .35), transparent 32%),
        linear-gradient(180deg, #dff3ef 0%, #eff4dc 54%, #f8f2d9 100%);
      color: var(--ink);
    }

    button { font: inherit; color: inherit; }
    button:focus-visible { outline: 3px solid #df8d3f; outline-offset: 3px; }

    .game {
      width: min(100%, 520px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-mark {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border-radius: 15px 15px 15px 5px;
      background: #327353;
      color: #fff7da;
      font-size: 24px;
      box-shadow: 0 4px 0 #24563f;
      transform: rotate(-3deg);
    }
    .brand-copy { min-width: 0; }
    .brand-copy strong { display: block; font-size: 18px; letter-spacing: -.04em; }
    .brand-copy span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }

    .wallet {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      padding: 8px 11px;
      border: 1px solid rgba(75, 111, 72, .16);
      border-radius: 999px;
      background: rgba(255, 250, 240, .84);
      color: #68471a;
      font-weight: 800;
      box-shadow: 0 2px 0 rgba(87, 107, 70, .08);
    }

    .level-line { display: flex; align-items: center; gap: 10px; }
    .level-label {
      display: flex;
      justify-content: space-between;
      width: 100%;
      color: #426650;
      font-size: 11px;
      font-weight: 800;
    }
    .xp-track {
      height: 8px;
      margin-top: 5px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(48, 101, 69, .16);
    }
    .xp-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: #e6a739;
      transition: width .45s cubic-bezier(.2,.8,.2,1);
    }

    .land {
      position: relative;
      min-height: 260px;
      overflow: hidden;
      border: 3px solid rgba(255, 252, 227, .9);
      border-radius: 26px 26px 18px 18px;
      background: linear-gradient(180deg, #bce2e1 0%, #d9edc8 53%, #84b86a 100%);
      box-shadow: 0 8px 0 rgba(77, 117, 69, .14), 0 16px 30px rgba(49, 87, 67, .1);
      isolation: isolate;
    }
    .land::after {
      position: absolute;
      z-index: -1;
      right: -14%;
      bottom: 42px;
      left: -12%;
      height: 92px;
      border-radius: 50% 50% 0 0;
      background: #72a95e;
      content: "";
    }
    .sun {
      position: absolute;
      top: 20px;
      right: 27px;
      width: 43px;
      height: 43px;
      border-radius: 50%;
      background: #f6c95d;
      box-shadow: 0 0 0 8px rgba(255, 222, 127, .23), 0 0 25px rgba(246, 201, 93, .6);
    }
    .hill {
      position: absolute;
      z-index: -2;
      right: -22px;
      bottom: 78px;
      width: 69%;
      height: 133px;
      border-radius: 58% 0 0 0;
      background: #99c985;
      transform: rotate(-8deg);
    }
    .hill.back {
      right: auto;
      bottom: 107px;
      left: -18px;
      width: 68%;
      height: 103px;
      background: #a9d8bd;
      transform: rotate(7deg);
    }
    .cloud {
      position: absolute;
      top: 40px;
      left: 24px;
      width: 70px;
      height: 20px;
      border-radius: 50px;
      background: rgba(255, 255, 242, .76);
    }
    .cloud::before, .cloud::after {
      position: absolute;
      bottom: 4px;
      border-radius: 50%;
      background: inherit;
      content: "";
    }
    .cloud::before { left: 13px; width: 27px; height: 27px; }
    .cloud::after { left: 34px; width: 20px; height: 20px; }
    .cloud.two { top: 82px; left: 45%; transform: scale(.65); opacity: .7; }

    .barn {
      position: absolute;
      top: 76px;
      left: 50%;
      width: 67px;
      height: 51px;
      border: 3px solid #fff0cc;
      border-radius: 4px 4px 7px 7px;
      background: #bf6650;
      box-shadow: 0 4px 0 rgba(105, 74, 47, .12);
      transform: translateX(-50%);
    }
    .barn::before {
      position: absolute;
      top: -22px;
      left: -7px;
      width: 75px;
      height: 30px;
      border: 3px solid #fff0cc;
      border-bottom: 0;
      border-radius: 9px 9px 0 0;
      background: #98513e;
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      content: "";
    }
    .barn-door {
      position: absolute;
      bottom: 0;
      left: 23px;
      width: 18px;
      height: 30px;
      border: 2px solid #f4d8a4;
      border-bottom: 0;
      border-radius: 8px 8px 0 0;
      background: #744538;
    }

    .tree { position: absolute; z-index: 1; bottom: 100px; width: 27px; height: 60px; }
    .tree::before {
      position: absolute;
      bottom: 0;
      left: 11px;
      width: 6px;
      height: 31px;
      border-radius: 4px;
      background: #805943;
      content: "";
    }
    .tree::after {
      position: absolute;
      top: 0;
      left: 0;
      width: 27px;
      height: 34px;
      border-radius: 48% 52% 43% 57%;
      background: #3e8054;
      box-shadow: 10px 12px 0 -3px #68a75f;
      content: "";
    }
    .tree.left { left: 25px; transform: scale(.83); }
    .tree.right { right: 27px; bottom: 115px; transform: scale(1.05); }
    .fence {
      position: absolute;
      right: 0;
      bottom: 67px;
      left: 0;
      height: 15px;
      border-top: 5px solid #e8d39b;
      border-bottom: 5px solid #e8d39b;
      opacity: .95;
    }
    .fence::before {
      position: absolute;
      top: -10px;
      right: 13%;
      left: 13%;
      height: 27px;
      background: repeating-linear-gradient(90deg, #e8d39b 0 5px, transparent 5px 35px);
      content: "";
    }

    .land-caption {
      position: absolute;
      z-index: 3;
      top: 14px;
      left: 14px;
      padding: 6px 9px;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 99px;
      background: rgba(255, 250, 240, .75);
      color: #375f4a;
      font-size: 10px;
      font-weight: 800;
      backdrop-filter: blur(4px);
    }

    .field {
      position: absolute;
      z-index: 2;
      right: 22px;
      bottom: 17px;
      left: 22px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
    }
    .plot {
      position: relative;
      display: grid;
      min-height: 59px;
      place-items: center;
      padding: 6px 4px;
      border: 2px solid rgba(255, 221, 165, .8);
      border-radius: 14px 14px 10px 10px;
      background: repeating-linear-gradient(0deg, #936743 0 7px, #a8794e 7px 12px);
      color: #fff8df;
      cursor: pointer;
      box-shadow: 0 4px 0 #714f36;
      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .plot:active { transform: translateY(3px) scale(.98); box-shadow: 0 1px 0 #714f36; }
    .plot.locked { filter: grayscale(.75); opacity: .72; }
    .plot.ready { animation: ready-bob 1.8s ease-in-out infinite; }
    .plot-icon { font-size: 23px; line-height: 1; }
    .plot-label { margin-top: 3px; font-size: 9px; font-weight: 800; text-shadow: 0 1px 2px #503924; }
    @keyframes ready-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

    .story-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 13px;
      border: 1px solid rgba(98, 125, 72, .18);
      border-radius: 15px;
      background: rgba(255, 250, 240, .82);
      box-shadow: 0 3px 0 rgba(70, 107, 67, .08);
    }
    .story-avatar {
      display: grid;
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 50%;
      background: #f4d78f;
      font-size: 22px;
    }
    .story-copy { flex: 1; min-width: 0; }
    .story-copy strong { display: block; font-size: 12px; }
    .story-copy span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; line-height: 1.35; }
    .story-arrow { color: #668258; font-size: 20px; font-weight: 900; }

    .inventory {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 1px 2px;
    }
    .inventory-title { color: #52705c; font-size: 10px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
    .inventory-items { display: flex; gap: 6px; }
    .inventory-chip {
      min-width: 42px;
      padding: 6px 8px;
      border: 1px solid rgba(89, 115, 77, .14);
      border-radius: 11px;
      background: rgba(255, 250, 240, .72);
      color: #47664e;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
    }

    .panel {
      min-height: 76px;
      flex: 1;
      padding: 14px;
      border: 1px solid rgba(96, 122, 74, .17);
      border-radius: 18px;
      background: rgba(255, 250, 240, .88);
      box-shadow: 0 4px 0 rgba(83, 109, 66, .08);
    }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .panel-heading h1 { margin: 0; font-size: 15px; letter-spacing: -.03em; }
    .panel-heading span { color: var(--muted); font-size: 10px; }
    .panel-actions { display: flex; gap: 8px; margin-top: 12px; }
    .action {
      min-height: 40px;
      flex: 1;
      padding: 9px 10px;
      border: 0;
      border-radius: 12px;
      background: #327353;
      color: #fff9e6;
      cursor: pointer;
      font-size: 12px;
      font-weight: 900;
      box-shadow: 0 3px 0 #24563f;
      transition: transform .15s ease, filter .15s ease;
    }
    .action.secondary { background: #e8d79f; color: #4a5038; box-shadow: 0 3px 0 #c6b576; }
    .action:active { transform: translateY(2px); filter: brightness(.96); box-shadow: 0 1px 0 #24563f; }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-top: auto;
      padding: 6px;
      border: 1px solid rgba(89, 115, 77, .14);
      border-radius: 17px;
      background: rgba(255, 250, 240, .9);
    }
    .tab {
      min-height: 49px;
      display: grid;
      place-items: center;
      gap: 1px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: #65806c;
      cursor: pointer;
      font-size: 9px;
      font-weight: 800;
    }
    .tab-icon { font-size: 18px; line-height: 1; }
    .tab.active { background: #e0edcf; color: #2d6948; }

    .toast {
      position: fixed;
      z-index: 10;
      right: 18px;
      bottom: calc(88px + env(safe-area-inset-bottom));
      left: 18px;
      width: fit-content;
      max-width: min(440px, calc(100vw - 36px));
      margin: auto;
      padding: 11px 15px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 14px;
      background: #284f3e;
      color: #fff9e8;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(33, 59, 43, .22);
      opacity: 0;
      pointer-events: none;
      transform: translateY(9px);
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    .sheet-backdrop {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      align-items: end;
      background: rgba(29, 49, 40, .38);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
    .sheet {
      width: min(100%, 520px);
      max-height: 78dvh;
      overflow-y: auto;
      margin: 0 auto;
      padding: 19px 18px max(20px, env(safe-area-inset-bottom));
      border-radius: 24px 24px 0 0;
      background: #fffaf0;
      box-shadow: 0 -12px 40px rgba(30, 55, 39, .2);
      transform: translateY(20px);
      transition: transform .25s cubic-bezier(.2,.8,.2,1);
    }
    .sheet-backdrop.open .sheet { transform: translateY(0); }
    .sheet-grip { width: 38px; height: 4px; margin: -7px auto 15px; border-radius: 9px; background: #d7d6bd; }
    .sheet h2 { margin: 0 0 5px; font-size: 19px; letter-spacing: -.04em; }
    .sheet p { margin: 0 0 14px; color: #587266; font-size: 12px; line-height: 1.5; }
    .choice-list { display: grid; gap: 8px; }
    .choice {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border: 1px solid #e2e1ca;
      border-radius: 14px;
      background: #f6f3df;
      text-align: left;
      cursor: pointer;
    }
    .choice:disabled { opacity: .46; cursor: not-allowed; }
    .choice strong { display: block; font-size: 13px; }
    .choice small { display: block; margin-top: 3px; color: #63806b; font-size: 10px; }
    .choice-price { flex: 0 0 auto; color: #735321; font-size: 11px; font-weight: 900; }
    .quest-progress { height: 9px; margin: 14px 0; overflow: hidden; border-radius: 9px; background: #e4e6d0; }
    .quest-progress > span { display: block; height: 100%; border-radius: inherit; background: #78af5f; transition: width .3s ease; }
    .empty-note { padding: 13px; border-radius: 13px; background: #f2f0dc; color: #587266; font-size: 12px; line-height: 1.5; }
    .save-state { color: #5a7963; font-size: 9px; text-align: center; }

    @media (max-height: 720px) {
      .game { gap: 9px; padding-top: max(9px, env(safe-area-inset-top)); }
      .land { min-height: 218px; }
      .plot { min-height: 50px; }
      .story-strip { padding-block: 8px; }
      .panel { padding: 10px 12px; }
    }
    @media (min-width: 600px) {
      body { display: grid; place-items: center; padding: 22px 0; }
      .game { min-height: min(880px, 100dvh - 44px); border: 1px solid rgba(64, 101, 68, .14); border-radius: 31px; box-shadow: 0 20px 70px rgba(57, 91, 62, .15); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <!--
  THESIS: A tiny valley farm grows through visible plots and a neighbor-led story, not a dashboard of counters.
  OWN-WORLD: Fresh hillside greens, painted soil rows, sunlit sky, warm harvest-gold controls, hand-built landscape shapes.
  STORY: Plant a seed, watch its plot change with time, harvest, trade, and follow Amina's chapter-by-chapter requests.
  FIRST VIEWPORT: Wallet and level sit above a full illustrated farm; plot tiles are directly tappable, with the current chapter and four bottom destinations beneath.
  FORM: Experience surface, ranked grounded direction: a pocket illustrated valley map; staging is the playable farm itself, responsive for Telegram's narrow in-app viewport.
  -->
  <main class="game">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">🌻</div>
        <div class="brand-copy">
          <strong>Долина</strong>
          <span>маленькая ферма, большие планы</span>
        </div>
      </div>
      <div class="wallet" aria-label="Монеты">🪙 <span id="coins">30</span></div>
    </header>

    <section aria-label="Уровень фермера">
      <div class="level-line">
        <div class="level-label"><span id="levelLabel">Уровень 1 · Фермер-новичок</span><span id="xpLabel">0 / 50 опыта</span></div>
      </div>
      <div class="xp-track"><div class="xp-fill" id="xpFill"></div></div>
    </section>

    <section class="land" aria-label="Иллюстрированная ферма">
      <span class="land-caption" id="landCaption">Участок Амины</span>
      <div class="sun" aria-hidden="true"></div>
      <div class="cloud" aria-hidden="true"></div>
      <div class="cloud two" aria-hidden="true"></div>
      <div class="hill back" aria-hidden="true"></div>
      <div class="hill" aria-hidden="true"></div>
      <div class="barn" aria-hidden="true"><div class="barn-door"></div></div>
      <div class="tree left" aria-hidden="true"></div>
      <div class="tree right" aria-hidden="true"></div>
      <div class="fence" aria-hidden="true"></div>
      <div class="field" id="field"></div>
    </section>

    <button class="story-strip" id="storyShortcut" type="button" aria-label="Открыть историю и задания">
      <span class="story-avatar" aria-hidden="true">👩🏽‍🌾</span>
      <span class="story-copy"><strong id="questTitle">Амина ждёт тебя</strong><span id="questTeaser">Посади первые семена на участке.</span></span>
      <span class="story-arrow" aria-hidden="true">›</span>
    </button>

    <section class="inventory" aria-label="Запас семян">
      <span class="inventory-title">В кармане</span>
      <div class="inventory-items" id="inventoryItems"></div>
    </section>

    <section class="panel" id="panel" aria-live="polite">
      <div class="panel-heading"><h1 id="panelTitle">Твоя ферма проснулась</h1><span id="panelHint">Что посадим?</span></div>
      <div class="panel-actions">
        <button class="action" id="plantAction" type="button">🌱 Посадить</button>
        <button class="action secondary" id="shopAction" type="button">🧺 На рынок</button>
      </div>
    </section>

    <nav class="tabs" aria-label="Разделы игры">
      <button class="tab active" data-tab="farm" type="button"><span class="tab-icon">🏡</span>Ферма</button>
      <button class="tab" data-tab="shop" type="button"><span class="tab-icon">🧺</span>Рынок</button>
      <button class="tab" data-tab="story" type="button"><span class="tab-icon">📜</span>История</button>
      <button class="tab" data-tab="profile" type="button"><span class="tab-icon">🌟</span>Путь</button>
    </nav>
    <p class="save-state" id="saveState">Прогресс сохраняется в Telegram</p>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <div class="sheet-backdrop" id="sheetBackdrop" aria-hidden="true">
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-grip" aria-hidden="true"></div>
      <h2 id="sheetTitle"></h2>
      <p id="sheetDescription"></p>
      <div id="sheetContent"></div>
    </section>
  </div>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "valley_farm_save_v1";
      const MAX_PLOTS = 6;
      const crops = {
        turnip: { name: "Репа", emoji: "🌱", seed: 4, price: 8, grow: 30, xp: 10, level: 1, fruit: "🥬" },
        carrot: { name: "Морковь", emoji: "🥕", seed: 8, price: 15, grow: 90, xp: 18, level: 1, fruit: "🥕" },
        wheat: { name: "Пшеница", emoji: "🌾", seed: 14, price: 26, grow: 180, xp: 28, level: 2, fruit: "🌾" },
        pumpkin: { name: "Тыква", emoji: "🎃", seed: 24, price: 45, grow: 300, xp: 45, level: 3, fruit: "🎃" }
      };
      const chapters = [
        { title: "Первые семена", text: "Соседка Амина подарила тебе маленький участок. Посади первую культуру!", stat: "planted", goal: 1, coins: 10, xp: 10 },
        { title: "Первый урожай", text: "Пора собрать то, что выросло. Урожай можно продать за монеты.", stat: "harvested", goal: 1, coins: 15, xp: 20 },
        { title: "Ферма растёт", text: "Посади ещё несколько культур — запас семян пригодится.", stat: "planted", goal: 3, coins: 20, xp: 25 },
        { title: "На ярмарку!", text: "Собери пять урожаев и подготовься к большой торговле.", stat: "harvested", goal: 5, coins: 30, xp: 35 },
        { title: "Умелый торговец", text: "Продай урожай на общую сумму 100 монет.", stat: "earned", goal: 100, coins: 40, xp: 50 },
        { title: "Большая ферма", text: "Достигни 3-го уровня, чтобы открыть тыквенные семена.", stat: "level", goal: 3, coins: 60, xp: 60 }
      ];
      const defaultState = () => ({
        version: 1, coins: 30, xp: 0, level: 1, planted: 0, harvested: 0, earned: 0, chapter: 0,
        inventory: {
          turnip: { seeds: 3, produce: 0 }, carrot: { seeds: 1, produce: 0 },
          wheat: { seeds: 0, produce: 0 }, pumpkin: { seeds: 0, produce: 0 }
        },
        plots: {}
      });

      const tg = window.Telegram?.WebApp;
      const $ = (id) => document.getElementById(id);
      const cloudStorageAvailable = () => Boolean(
        tg?.initData &&
        typeof tg.CloudStorage?.getItem === "function" &&
        typeof tg.CloudStorage?.setItem === "function"
      );
      let state = defaultState();
      let activeTab = "farm";
      let selectedPlot = null;
      let toastTimer;

      if (tg) {
        tg.ready();
        tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor("#dff3ef");
        if (tg.setBackgroundColor) tg.setBackgroundColor("#eef5eb");
      }

      function cloudCall(method, ...args) {
        return new Promise((resolve, reject) => {
          try {
            tg.CloudStorage[method](...args, (error, value) => {
              if (error) reject(error);
              else resolve(value);
            });
          } catch (error) {
            reject(error);
          }
        });
      }

      async function loadState() {
        try {
          if (cloudStorageAvailable()) {
            const value = await cloudCall("getItem", STORAGE_KEY);
            if (value) state = normalizeState(JSON.parse(value));
            $("saveState").textContent = "Прогресс хранится в Telegram ☁️";
            return;
          }
          const value = localStorage.getItem(STORAGE_KEY);
          if (value) state = normalizeState(JSON.parse(value));
          $("saveState").textContent = "Предпросмотр: сохранение в этом браузере";
        } catch (error) {
          console.error("Не удалось загрузить сохранение фермы", error);
          $("saveState").textContent = "Не удалось загрузить облачное сохранение";
          showToast("Не получилось загрузить сохранение. Проверь интернет и обнови игру.");
        }
      }

      function normalizeState(saved) {
        const fresh = defaultState();
        if (!saved || typeof saved !== "object" || saved.version !== 1) return fresh;
        const numberKeys = ["coins", "xp", "level", "planted", "harvested", "earned", "chapter"];
        for (const key of numberKeys) {
          if (Number.isFinite(saved[key]) && saved[key] >= 0) fresh[key] = Math.floor(saved[key]);
        }
        for (const crop of Object.keys(crops)) {
          const stored = saved.inventory?.[crop];
          if (stored) {
            fresh.inventory[crop] = {
              seeds: validCount(stored.seeds),
              produce: validCount(stored.produce)
            };
          }
        }
        if (saved.plots && typeof saved.plots === "object") {
          for (const [id, plot] of Object.entries(saved.plots)) {
            const plotId = Number(id);
            if (Number.isInteger(plotId) && plotId >= 1 && plotId <= MAX_PLOTS &&
                plot && crops[plot.crop] && Number.isFinite(plot.plantedAt)) {
              fresh.plots[plotId] = { crop: plot.crop, plantedAt: Math.floor(plot.plantedAt) };
            }
          }
        }
        fresh.chapter = Math.min(fresh.chapter, chapters.length);
        fresh.level = levelForXp(fresh.xp);
        return fresh;
      }

      function validCount(value) {
        return Number.isSafeInteger(value) && value >= 0 ? value : 0;
      }

      let saveQueue = Promise.resolve();
      function saveState() {
        const value = JSON.stringify(state);
        saveQueue = saveQueue.then(async () => {
          if (cloudStorageAvailable()) {
            await cloudCall("setItem", STORAGE_KEY, value);
            $("saveState").textContent = "Прогресс хранится в Telegram ☁️";
          } else {
            localStorage.setItem(STORAGE_KEY, value);
            $("saveState").textContent = "Предпросмотр: сохранение в этом браузере";
          }
        }).catch((error) => {
          console.error("Не удалось сохранить ферму", error);
          $("saveState").textContent = "Ошибка сохранения — проверь интернет";
          showToast("Прогресс не сохранился. Проверь соединение и попробуй ещё раз.");
        });
        return saveQueue;
      }

      function levelForXp(xp) {
        let level = 1;
        let remaining = xp;
        while (remaining >= level * 50) {
          remaining -= level * 50;
          level += 1;
        }
        return level;
      }

      function xpWithinLevel() {
        return state.xp - (state.level - 1) * state.level * 25;
      }

      function openPlots() {
        return Math.min(2 + Math.floor((state.level - 1) / 2), MAX_PLOTS);
      }

      function questProgress() {
        if (state.chapter >= chapters.length) return null;
        const quest = chapters[state.chapter];
        return { quest, value: state[quest.stat], ready: state[quest.stat] >= quest.goal };
      }

      function updateHeader() {
        $("coins").textContent = state.coins;
        $("levelLabel").textContent = `Уровень ${state.level} · ${["Фермер-новичок", "Хозяин огорода", "Мастер долины", "Садовый хранитель"][Math.min(state.level - 1, 3)]}`;
        const needed = state.level * 50;
        const current = xpWithinLevel();
        $("xpLabel").textContent = `${current} / ${needed} опыта`;
        $("xpFill").style.width = `${Math.max(0, Math.min(100, current / needed * 100))}%`;
        const progress = questProgress();
        $("questTitle").textContent = progress ? `Амина · ${progress.quest.title}` : "Амина тобой гордится";
        $("questTeaser").textContent = progress
          ? (progress.ready ? "Задание выполнено — загляни за наградой!" : progress.quest.text)
          : "Ты прошёл всю историю долины!";
      }

      function renderField() {
        const field = $("field");
        field.replaceChildren();
        for (let id = 1; id <= 6; id += 1) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "plot";
          button.setAttribute("aria-label", `Грядка ${id}`);
          if (id > openPlots()) {
            button.classList.add("locked");
            button.innerHTML = `<span class="plot-icon">🔒</span><span class="plot-label">Уровень ${2 * (id - 2) + 1}</span>`;
            button.addEventListener("click", () => showToast("Повысь уровень, чтобы открыть новую грядку."));
          } else if (state.plots[id]) {
            const plot = state.plots[id];
            const crop = crops[plot.crop];
            const ready = Date.now() >= plot.plantedAt + crop.grow * 1000;
            button.classList.toggle("ready", ready);
            button.innerHTML = `<span class="plot-icon">${ready ? crop.fruit : crop.emoji}</span><span class="plot-label">${ready ? "Собрать!" : crop.name}</span>`;
            button.addEventListener("click", () => ready ? harvest(id) : showToast(`Ещё растёт: ${formatTime(plot.plantedAt + crop.grow * 1000 - Date.now())}`));
          } else {
            button.innerHTML = `<span class="plot-icon">＋</span><span class="plot-label">Свободно</span>`;
            button.addEventListener("click", () => openPlantSheet(id));
          }
          field.append(button);
        }
      }

      function renderInventory() {
        const root = $("inventoryItems");
        root.replaceChildren();
        for (const [id, crop] of Object.entries(crops)) {
          const item = document.createElement("span");
          item.className = "inventory-chip";
          item.title = `${crop.name}: семян ${state.inventory[id].seeds}, урожая ${state.inventory[id].produce}`;
          item.textContent = `${crop.emoji} ${state.inventory[id].seeds}`;
          root.append(item);
        }
      }

      function renderPanel() {
        const title = $("panelTitle");
        const hint = $("panelHint");
        const plant = $("plantAction");
        const shop = $("shopAction");
        plant.hidden = false;
        shop.hidden = false;
        if (activeTab === "farm") {
          title.textContent = "Твоя ферма проснулась";
          hint.textContent = `${openPlots()} грядки открыты`;
          plant.textContent = "🌱 Посадить";
          shop.textContent = "🧺 На рынок";
          plant.onclick = () => openPlantSheet(null);
          shop.onclick = () => { activeTab = "shop"; render(); };
        } else if (activeTab === "shop") {
          title.textContent = "Магазин у старой мельницы";
          hint.textContent = `${state.coins} монет`;
          plant.textContent = "🌰 Купить семена";
          shop.textContent = "🧺 Продать урожай";
          plant.onclick = openSeedShop;
          shop.onclick = openSellSheet;
        } else if (activeTab === "story") {
          title.textContent = "Истории долины";
          hint.textContent = state.chapter >= chapters.length ? "Все главы пройдены" : `Глава ${state.chapter + 1} из ${chapters.length}`;
          plant.textContent = "📜 Открыть главу";
          shop.hidden = true;
          plant.onclick = openQuestSheet;
        } else {
          title.textContent = "Твой путь фермера";
          hint.textContent = `Уровень ${state.level}`;
          plant.textContent = "🌟 Мой профиль";
          shop.textContent = "📜 История";
          plant.onclick = openProfileSheet;
          shop.onclick = openQuestSheet;
        }
      }

      function render() {
        updateHeader();
        renderField();
        renderInventory();
        renderPanel();
        document.querySelectorAll(".tab").forEach((tab) => {
          const active = tab.dataset.tab === activeTab;
          tab.classList.toggle("active", active);
          tab.setAttribute("aria-current", active ? "page" : "false");
        });
      }

      function formatTime(milliseconds) {
        const seconds = Math.max(0, Math.ceil(milliseconds / 1000));
        if (seconds >= 60) return `${Math.floor(seconds / 60)} мин ${seconds % 60} сек`;
        return `${seconds} сек`;
      }

      function showToast(message) {
        const toast = $("toast");
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
      }

      function openSheet(title, description, content) {
        $("sheetTitle").textContent = title;
        $("sheetDescription").textContent = description;
        const root = $("sheetContent");
        root.replaceChildren();
        root.append(content);
        $("sheetBackdrop").classList.add("open");
        $("sheetBackdrop").setAttribute("aria-hidden", "false");
      }

      function closeSheet() {
        $("sheetBackdrop").classList.remove("open");
        $("sheetBackdrop").setAttribute("aria-hidden", "true");
        selectedPlot = null;
      }

      function makeChoice(title, subtitle, price, action, disabled = false) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice";
        button.disabled = disabled;
        const copy = document.createElement("span");
        const strong = document.createElement("strong");
        strong.textContent = title;
        const small = document.createElement("small");
        small.textContent = subtitle;
        copy.append(strong, small);
        const cost = document.createElement("span");
        cost.className = "choice-price";
        cost.textContent = price;
        button.append(copy, cost);
        button.addEventListener("click", action);
        return button;
      }

      function choiceList() {
        const list = document.createElement("div");
        list.className = "choice-list";
        return list;
      }

      function openPlantSheet(plotId) {
        selectedPlot = plotId;
        const list = choiceList();
        let available = 0;
        for (const [id, crop] of Object.entries(crops)) {
          if (crop.level > state.level) continue;
          const count = state.inventory[id].seeds;
          if (!count) continue;
          available += count;
          list.append(makeChoice(`${crop.emoji} ${crop.name}`, `${formatTime(crop.grow * 1000)} до урожая · +${crop.xp} опыта`, `${count} сем.`, () => {
            const target = selectedPlot;
            if (target) plant(target, id);
            else {
              closeSheet();
              const empty = Array.from({ length: openPlots() }, (_, i) => i + 1).find((n) => !state.plots[n]);
              if (empty) plant(empty, id);
              else showToast("Все грядки заняты. Собери урожай.");
            }
          }));
        }
        if (!available) {
          const note = document.createElement("div");
          note.className = "empty-note";
          note.textContent = "Семена закончились. Загляни на рынок — там можно купить новые.";
          list.append(note);
          openSheet("Нечего сажать", "Семена ждут тебя на рынке.", list);
          return;
        }
        openSheet(plotId ? `Грядка ${plotId}` : "Выбери семена", "Посадка начнёт таймер. Даже когда ты выйдешь, растения продолжат расти.", list);
      }

      async function plant(plotId, cropId) {
        if (!state.inventory[cropId]?.seeds || plotId > openPlots() || state.plots[plotId]) {
          showToast("Не удалось посадить: проверь грядку и запас семян.");
          return;
        }
        state.inventory[cropId].seeds -= 1;
        state.planted += 1;
        state.plots[plotId] = { crop: cropId, plantedAt: Date.now() };
        closeSheet();
        await saveState();
        render();
        showToast(`${crops[cropId].name} посажена. Скоро появится урожай!`);
      }

      async function harvest(plotId) {
        const plot = state.plots[plotId];
        if (!plot) return;
        const crop = crops[plot.crop];
        if (Date.now() < plot.plantedAt + crop.grow * 1000) {
          showToast(`Ещё растёт: ${formatTime(plot.plantedAt + crop.grow * 1000 - Date.now())}`);
          return;
        }
        delete state.plots[plotId];
        state.inventory[plot.crop].produce += 1;
        state.harvested += 1;
        const previousLevel = state.level;
        state.xp += crop.xp;
        state.level = levelForXp(state.xp);
        await saveState();
        render();
        showToast(state.level > previousLevel ? `Урожай собран! Новый уровень: ${state.level} 🎉` : `${crop.name} собрана! +${crop.xp} опыта`);
      }

      function openSeedShop() {
        const list = choiceList();
        for (const [id, crop] of Object.entries(crops)) {
          const locked = state.level < crop.level;
          list.append(makeChoice(
            `${crop.emoji} ${crop.name}`,
            locked ? `Откроется на ${crop.level}-м уровне` : `${formatTime(crop.grow * 1000)} до урожая · продажа за ${crop.price}🪙`,
            locked ? "🔒" : `${crop.seed}🪙`,
            async () => {
              if (locked) return;
              if (state.coins < crop.seed) { showToast("Не хватает монет. Продай урожай."); return; }
              state.coins -= crop.seed;
              state.inventory[id].seeds += 1;
              await saveState();
              render();
              closeSheet();
              showToast(`Куплены семена: ${crop.name}`);
            },
            locked
          ));
        }
        openSheet("Семенная лавка", `У тебя ${state.coins} монет. Новые культуры открываются с уровнем.`, list);
      }

      function openSellSheet() {
        const list = choiceList();
        let hasProduce = false;
        for (const [id, crop] of Object.entries(crops)) {
          const count = state.inventory[id].produce;
          if (!count) continue;
          hasProduce = true;
          list.append(makeChoice(
            `${crop.fruit} ${crop.name}`,
            `Урожай в запасе: ${count}`,
            `+${crop.price}🪙`,
            async () => {
              state.inventory[id].produce -= 1;
              state.coins += crop.price;
              state.earned += crop.price;
              await saveState();
              render();
              closeSheet();
              showToast(`${crop.name} продана за ${crop.price} монет`);
            }
          ));
        }
        if (!hasProduce) {
          const note = document.createElement("div");
          note.className = "empty-note";
          note.textContent = "Пока нечего продавать. Собери созревший урожай на своей ферме.";
          list.append(note);
        }
        openSheet("Рынок", "Выбери урожай, который хочешь продать.", list);
      }

      function openQuestSheet() {
        const list = choiceList();
        if (state.chapter >= chapters.length) {
          const note = document.createElement("div");
          note.className = "empty-note";
          note.textContent = "Амина улыбается: ты помог всей долине и стал настоящим мастером фермы. Продолжай выращивать культуры и открывать грядки!";
          list.append(note);
          openSheet("История завершена", "Долина теперь цветёт благодаря тебе.", list);
          return;
        }
        const quest = chapters[state.chapter];
        const current = state[quest.stat];
        const ready = current >= quest.goal;
        const description = document.createElement("div");
        description.className = "empty-note";
        description.textContent = quest.text;
        list.append(description);
        const progress = document.createElement("div");
        progress.className = "quest-progress";
        const fill = document.createElement("span");
        fill.style.width = `${Math.min(100, current / quest.goal * 100)}%`;
        progress.append(fill);
        list.append(progress);
        const status = document.createElement("div");
        status.className = "empty-note";
        status.textContent = `Задание: ${Math.min(current, quest.goal)} / ${quest.goal} · Награда: ${quest.coins}🪙 и ${quest.xp} опыта`;
        list.append(status);
        const claim = document.createElement("button");
        claim.type = "button";
        claim.className = "action";
        claim.style.width = "100%";
        claim.style.marginTop = "12px";
        claim.textContent = ready ? "Забрать награду" : "Продолжить ферму";
        claim.disabled = !ready;
        claim.addEventListener("click", async () => {
          if (!ready) return;
          state.chapter += 1;
          state.coins += quest.coins;
          const previousLevel = state.level;
          state.xp += quest.xp;
          state.level = levelForXp(state.xp);
          await saveState();
          closeSheet();
          render();
          showToast(state.level > previousLevel ? `Глава пройдена! Новый уровень ${state.level} 🎉` : "Глава пройдена! Награда у тебя.");
        });
        list.append(claim);
        openSheet(`Глава ${state.chapter + 1} · ${quest.title}`, "Амина оставила тебе новое поручение.", list);
      }

      function openProfileSheet() {
        const list = choiceList();
        const needed = state.level * 50;
        const current = xpWithinLevel();
        const notes = [
          `Уровень фермера: ${state.level}`,
          `Опыт до следующего уровня: ${current} / ${needed}`,
          `Монеты: ${state.coins}`,
          `Посажено культур: ${state.planted}`,
          `Собрано урожаев: ${state.harvested}`,
          `Продано на: ${state.earned} монет`,
          `Открыто грядок: ${openPlots()} / ${MAX_PLOTS}`
        ];
        for (const text of notes) {
          const line = document.createElement("div");
          line.className = "empty-note";
          line.textContent = text;
          list.append(line);
        }
        openSheet("Твой путь фермера", "Каждая собранная культура приближает новый уровень.", list);
      }

      $("sheetBackdrop").addEventListener("click", (event) => {
        if (event.target === $("sheetBackdrop")) closeSheet();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeSheet();
      });
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          activeTab = tab.dataset.tab;
          if (activeTab === "story") openQuestSheet();
          else if (activeTab === "profile") openProfileSheet();
          else if (activeTab === "shop") openSeedShop();
          render();
        });
      });
      $("storyShortcut").addEventListener("click", openQuestSheet);
      $("plantAction").addEventListener("click", () => openPlantSheet(null));
      $("shopAction").addEventListener("click", () => { activeTab = "shop"; render(); openSeedShop(); });

      async function boot() {
        try {
          await loadState();
          render();
          setInterval(() => {
            if (activeTab === "farm") renderField();
          }, 1000);
        } catch (error) {
          console.error("Не удалось запустить игру", error);
          showToast("Не удалось открыть сохранение фермы.");
        }
      }

      boot();
    })();
  </script>
</body>
</html>
